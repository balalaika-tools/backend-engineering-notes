[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ctc-database",
    "asyncpg>=0.31.0",
    "boto3>=1.43.89,<2",
    "greenlet>=3.5.5",
    "httpx>=0.28.1,<1",
    "langchain>=1.4.0,<2",
    "langchain-aws>=1.7.5",
    "nats-py>=2.15.0",
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "platform-observability",
    "platform-db",
    "pydantic-settings>=2.11.0,<3",
    "pyyaml>=6.0.3,<7",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlparse>=0.6.0",
    "structlog>=25,<26",
]

[tool.uv.sources]
ctc-database = { workspace = true }
platform-observability = { workspace = true }
platform-db = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
