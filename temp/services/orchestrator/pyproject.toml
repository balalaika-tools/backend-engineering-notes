[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ctc-database",
    "asyncpg>=0.31.0,<1",
    "boto3>=1.43.89",
    "fastapi>=0.141.1,<1",
    "greenlet>=3,<4",
    "httpx>=0.28.1,<1",
    "nats-py>=2.15.0",
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "platform-observability",
    "platform-db",
    "pydantic-settings>=2.11.0,<3",
    "pyjwt[crypto]>=2.10.1,<3",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.52.0,<1",
]

[tool.uv.sources]
ctc-database = { workspace = true }
platform-observability = { workspace = true }
platform-db = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
